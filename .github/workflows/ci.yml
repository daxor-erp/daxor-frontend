name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install frontend dependencies
        run: npm ci

      - name: Checkout backend for schema
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          path: backend

      - name: Install backend dependencies
        working-directory: backend/daxor-backend
        run: npm ci

      - name: Start backend server
        working-directory: backend/daxor-backend
        run: |
          npm run dev &
          echo $! > backend.pid
          sleep 10
        env:
          MONGODB_URI: mongodb://localhost:27017/daxor-test
          JWT_SECRET: test-secret-key
          PORT: 4000

      - name: Wait for backend to be ready
        run: |
          for i in {1..30}; do
            if curl -f http://localhost:4000/graphql > /dev/null 2>&1; then
              echo "Backend is ready"
              exit 0
            fi
            echo "Waiting for backend... ($i/30)"
            sleep 2
          done
          echo "Backend failed to start"
          exit 1

      - name: Run GraphQL Codegen
        run: npm run codegen
        env:
          GRAPHQL_SCHEMA_URL: http://localhost:4000/graphql

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_GRAPHQL_URL: http://localhost:4000/graphql

      - name: Lint
        run: npm run lint

      - name: Stop backend server
        if: always()
        run: |
          if [ -f backend/daxor-backend/backend.pid ]; then
            kill $(cat backend/daxor-backend/backend.pid) || true
          fi
