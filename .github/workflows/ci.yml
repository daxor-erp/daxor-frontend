name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check GraphQL Codegen
        run: |
          if [ ! -f "gql/graphql.ts" ]; then
            echo "Error: gql/graphql.ts not found. Please run 'npm run codegen' and commit the generated files."
            exit 1
          fi
          echo "GraphQL generated files found ✓"

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_GRAPHQL_URL: http://localhost:4000/graphql

      - name: Lint
        run: npm run lint
